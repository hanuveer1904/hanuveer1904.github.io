<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Certificate of Appreciation – Good Humans</title>

<style>
    :root {
        --primary: #1e3a8a;
        --accent: #3b82f6;
        --gold: #d4af37;
        --text-dark: #1f2933;
        --bg-light: #f8fafc;
    }

    * {
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0f172a, #020617);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 20px;
    }

    .certificate {
        background: var(--bg-light);
        width: 100%;
        max-width: 900px;
        padding: 55px;
        border-radius: 18px;
        position: relative;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        border: 6px solid var(--gold);
    }

    .certificate::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 12px;
        border: 2px dashed rgba(212, 175, 55, 0.6);
        pointer-events: none;
    }

    .header {
        text-align: center;
        margin-bottom: 45px;
    }

    .badge {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(circle at top, #60a5fa, #1e3a8a);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
        font-weight: bold;
        box-shadow: 0 10px 25px rgba(30, 58, 138, 0.5);
        margin-bottom: 20px;
    }

    .title {
        font-size: 38px;
        font-weight: 800;
        color: var(--primary);
        letter-spacing: 1.6px;
        margin: 0;
    }

    .subtitle {
        font-size: 15px;
        color: #475569;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 2.5px;
    }

    .content {
        text-align: center;
        margin: 45px 0 20px;
    }

    .presented {
        font-size: 18px;
        color: #374151;
        margin-bottom: 18px;
    }

    .name {
        font-size: 44px;
        font-weight: 900;
        color: var(--text-dark);
        margin: 12px 0;
        border-bottom: 2px solid var(--accent);
        display: inline-block;
        padding: 0 22px 8px;
    }

    .description {
        max-width: 650px;
        margin: 34px auto 0;
        font-size: 17px;
        line-height: 1.75;
        color: #334155;
    }

    .static-footer {
        margin-top: 55px;
        text-align: center;
        font-size: 14px;
        color: #64748b;
        letter-spacing: 1px;
    }

    @media print {
        body {
            background: none;
        }
        .certificate {
            box-shadow: none;
        }
    }
</style>
</head>
<body>

<div class="certificate">
    <div class="header">
        <div class="badge">❤</div>
        <h1 class="title">Certificate of Declaration</h1>
        <div class="subtitle">Non-Nirbhay Humans</div>
    </div>

    <div class="content">
        <div class="presented">This certificate is awarded to</div>

        <div class="name">You</div>

        <p class="description">
            In recognition of you being a good human and anti-nirbhay and not and Idiot you are awarded with this recogntion of Non-Nirbhay Human.
        </p>
    </div>

    <div class="static-footer">
        ★ Recognizing Smartness, Socialism and non-idiotism★
    </div>
</div>

</body>
</html>
